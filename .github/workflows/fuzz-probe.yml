name: Diagnose evaluation quota
on:
  push:
    branches: [feature/fuzz-100]
    paths: [eval/fuzz/probe.json]
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Inspect one request outcome without exposing credentials
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          python3 - <<'PY'
          import json, os, pathlib, sys, urllib.error
          sys.path.insert(0, "eval")
          import run, fuzz
          case = list(fuzz.requests(fuzz.generate()))[0]
          try:
              verdict, elapsed = run.check_gemini("gemini-3.5-flash-lite", os.environ["GEMINI_API_KEY"],
                  (run.ASSETS / "check_prompt.md").read_text(),
                  json.loads((run.ASSETS / "check_schema.json").read_text()), run.user_message(case))
              print("PROBE", json.dumps({"status": "answered", "seconds": elapsed}))
          except urllib.error.HTTPError as error:
              body = json.loads(error.read())
              details = body.get("error", {}).get("details", [])
              safe = {"status": error.code}
              safe["capacity_message"] = any(w in body.get("error", {}).get("message", "").lower()
                                             for w in ("overload", "high demand", "capacity"))
              safe["quota"] = [{k: v for k, v in violation.items() if k in ("quotaMetric", "quotaId", "quotaValue")}
                               for detail in details for violation in detail.get("violations", [])]
              safe["retry_delays"] = [d["retryDelay"] for d in details if "retryDelay" in d]
              print("PROBE", json.dumps(safe))
          except Exception as error:
              print("PROBE", json.dumps({"error": type(error).__name__}))
          PY
