name: Build APK

on:
  push:
    branches: [main]
    # Docs, design sources and the eval script don't change the app.
    paths-ignore:
      - README.md
      - brand/**
      - eval/**
  workflow_dispatch:
    inputs:
      pin_build_inputs:
        description: Instead of building, write the Gradle distribution checksum and dependency verification metadata and upload them for review
        type: boolean
        default: false

# One build at a time, so releases are published in push order and the newest is always "latest".
concurrency:
  group: build
  cancel-in-progress: false

# Nothing by default; each job asks for what it needs.
permissions: {}

jobs:
  # Tests and builds an unsigned APK. Read-only and secret-free: it runs the build scripts and
  # every dependency, so it never holds the signing key or a token that can write to the repo.
  build:
    if: ${{ !inputs.pin_build_inputs }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Fails the build if gradle-wrapper.jar isn't one Gradle published.
      - uses: gradle/actions/wrapper-validation@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0

      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0

      - name: Test
        run: |
          set -o pipefail
          ./gradlew testDebugUnitTest 2>&1 | tee build.log

      - name: Build
        run: |
          set -o pipefail
          ./gradlew assembleRelease 2>&1 | tee -a build.log

      # Surfaces compiler and Gradle errors as a single annotation on the run.
      - name: Summarize errors
        if: failure()
        run: |
          errors=$(grep -E -A12 '^e: |^\* What went wrong|FAILED$|^ERROR:' build.log | head -120)
          errors="${errors//'%'/'%25'}"
          errors="${errors//$'\n'/'%0A'}"
          echo "::error title=Build errors::${errors}"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: apk-unsigned
          path: app/build/outputs/apk/release/app-release-unsigned.apk
          if-no-files-found: error
          retention-days: 7

  # Signs what the build job made and publishes it. It runs no code from the repo, only the
  # runner's own apksigner, gh and the pinned actions below. The key is in the "signing"
  # environment, which only main and feature/* may use, so no other branch's workflow can read it.
  sign-and-publish:
    needs: build
    runs-on: ubuntu-latest
    environment: signing
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: apk-unsigned

      - name: Check signing secrets
        env:
          SIGNING_KEYSTORE_BASE64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: |
          missing=""
          for name in SIGNING_KEYSTORE_BASE64 SIGNING_STORE_PASSWORD SIGNING_KEY_ALIAS SIGNING_KEY_PASSWORD; do
            [ -n "${!name}" ] || missing="$missing $name"
          done
          if [ -n "$missing" ]; then
            echo "::error title=Signing secrets missing::Set$missing in the \"signing\" environment (Settings > Environments > signing > Environment secrets; see README)."
            exit 1
          fi

      # The newest build-tools on the runner; apksigner and zipalign come from there.
      - name: Find build-tools
        run: |
          sdk="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          tools=$(ls -d "$sdk"/build-tools/*/ 2>/dev/null | sort -V | tail -n 1)
          if [ -z "$tools" ] || [ ! -x "$tools/apksigner" ]; then
            echo "::error title=apksigner not found::No build-tools with apksigner under '$sdk/build-tools'."
            exit 1
          fi
          echo "Using $tools"
          echo "BUILD_TOOLS=${tools%/}" >> "$GITHUB_ENV"

      # AGP already aligns its output; this only realigns if it ever stops doing so.
      # 16 KB pages for any native libraries, as newer Android versions need.
      - name: Align
        run: |
          if "$BUILD_TOOLS/zipalign" -c -P 16 4 app-release-unsigned.apk; then
            mv app-release-unsigned.apk aligned.apk
          else
            "$BUILD_TOOLS/zipalign" -f -P 16 4 app-release-unsigned.apk aligned.apk
          fi

      - name: Sign
        env:
          SIGNING_KEYSTORE_BASE64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: |
          keystore="$RUNNER_TEMP/release.p12"
          trap 'rm -f "$keystore"' EXIT
          printf '%s' "$SIGNING_KEYSTORE_BASE64" | base64 --decode > "$keystore"
          # Passwords are read from the environment, so they never appear on a command line.
          "$BUILD_TOOLS/apksigner" sign \
            --ks "$keystore" --ks-type pkcs12 \
            --ks-key-alias "$SIGNING_KEY_ALIAS" \
            --ks-pass env:SIGNING_STORE_PASSWORD \
            --key-pass env:SIGNING_KEY_PASSWORD \
            --out signed.apk aligned.apk

      # Fails on a bad signature, and keeps the certificate's fingerprint for the release notes
      # so anyone can check what they downloaded: apksigner verify --print-certs linguize.apk
      - name: Verify
        run: |
          certs=$("$BUILD_TOOLS/apksigner" verify --print-certs signed.apk)
          echo "$certs"
          digest=$(echo "$certs" | grep -m1 'certificate SHA-256 digest:' | sed 's/.*certificate SHA-256 digest: *//')
          if [ -z "$digest" ]; then
            echo "::error title=Signature check failed::apksigner printed no certificate digest: $(echo "$certs" | head -5 | tr "\n" " ")"
            exit 1
          fi
          fingerprint=$(echo "$digest" | tr 'a-f' 'A-F' | sed 's/../&:/g; s/:$//')
          echo "CERT_SHA256=$fingerprint" >> "$GITHUB_ENV"

      - name: Name the APK
        env:
          RUN: ${{ github.run_number }}
          MAIN: ${{ github.ref == 'refs/heads/main' }}
        run: |
          if [ "$MAIN" = true ]; then apk="linguize-$RUN.apk"; else apk="linguize-branch-$RUN.apk"; fi
          mv signed.apk "$apk"
          sha256sum "$apk" > "$apk.sha256"
          echo "APK=$apk" >> "$GITHUB_ENV"

      # Signed provenance (which repo, commit and workflow built it), checkable with
      # gh attestation verify <apk> --repo <owner>/<repo>.
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: ${{ env.APK }}

      # Builds of other branches (run by hand) go up as a pre-release, which never becomes "latest".
      - name: Publish pre-release
        if: github.ref != 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          BRANCH: ${{ github.ref_name }}
          RUN: ${{ github.run_number }}
          SHA: ${{ github.sha }}
        run: |
          notes=$(printf 'Built from %s\n\nSigning certificate SHA-256: %s' "$BRANCH" "$CERT_SHA256")
          gh release create "branch-$RUN" "$APK" "$APK.sha256" \
            --target "$SHA" \
            --title "Branch build $RUN ($BRANCH)" \
            --notes "$notes" \
            --prerelease --latest=false

      # A release gives a direct download link that works from the phone's browser. The same
      # APK goes up under a fixed name, so releases/latest/download/linguize.apk is always the newest.
      - name: Publish release
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN: ${{ github.run_number }}
          SHA: ${{ github.sha }}
          # Passed through the environment so quotes in commit messages can't break the command.
          MESSAGE: ${{ github.event.head_commit.message || 'Manual build' }}
        run: |
          cp "$APK" linguize.apk
          sha256sum linguize.apk > linguize.apk.sha256
          notes=$(printf '%s\n\nSigning certificate SHA-256: %s' "$MESSAGE" "$CERT_SHA256")
          gh release create "build-$RUN" "$APK" "$APK.sha256" linguize.apk linguize.apk.sha256 \
            --target "$SHA" \
            --title "Build $RUN" \
            --notes "$notes" \
            --latest

  # Run by hand (workflow_dispatch with pin_build_inputs) after changing the Gradle version or any
  # dependency. It writes the official checksum of the Gradle distribution into
  # gradle-wrapper.properties and the SHA-256 of every dependency the build resolves into
  # gradle/verification-metadata.xml, and uploads both as the "build-inputs" artifact to review
  # and commit. Gradle then refuses any download that doesn't match.
  pin-build-inputs:
    if: ${{ inputs.pin_build_inputs }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: gradle/actions/wrapper-validation@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0

      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: 21

      - name: Pin the Gradle distribution
        run: |
          props=gradle/wrapper/gradle-wrapper.properties
          url=$(sed -n 's/^distributionUrl=//p' "$props" | sed 's/\\:/:/g')
          sum=$(curl -fsSL "$url.sha256" | tr -d '[:space:]')
          if ! [[ "$sum" =~ ^[0-9a-f]{64}$ ]]; then
            echo "::error title=No checksum::Got '$sum' from $url.sha256"
            exit 1
          fi
          sed -i '/^distributionSha256Sum=/d' "$props"
          echo "distributionSha256Sum=$sum" >> "$props"
          cat "$props"

      # Starts from a file that trusts only sources and javadoc jars (IDEs fetch those, the
      # build never does), unless the repo already has one, then records every artifact the
      # tests and the release build resolve, plugins included.
      - name: Write dependency verification metadata
        run: |
          meta=gradle/verification-metadata.xml
          if [ ! -f "$meta" ]; then
            cat > "$meta" <<'XML'
          <?xml version="1.0" encoding="UTF-8"?>
          <verification-metadata xmlns="https://schema.gradle.org/dependency-verification" xmlns:xsi="http://www.w3.org/2001/XMLSchema-instance" xsi:schemaLocation="https://schema.gradle.org/dependency-verification https://schema.gradle.org/dependency-verification/dependency-verification-1.3.xsd">
             <configuration>
                <verify-metadata>true</verify-metadata>
                <verify-signatures>false</verify-signatures>
                <trusted-artifacts>
                   <trust file=".*-javadoc[.]jar" regex="true"/>
                   <trust file=".*-sources[.]jar" regex="true"/>
                </trusted-artifacts>
             </configuration>
             <components/>
          </verification-metadata>
          XML
          fi
          ./gradlew --no-configuration-cache --write-verification-metadata sha256 testDebugUnitTest assembleRelease

      # Proves the pinned files work: a clean build with verification on.
      - name: Check a build verifies
        run: ./gradlew --no-build-cache --refresh-dependencies assembleRelease

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: build-inputs
          path: |
            gradle/wrapper/gradle-wrapper.properties
            gradle/verification-metadata.xml
          if-no-files-found: error
          retention-days: 7

  # Puts the pinned files up as a pre-release too, so they can be fetched where artifact
  # downloads aren't reachable. Runs no repo code, so it alone holds the write token.
  publish-build-inputs:
    needs: pin-build-inputs
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: build-inputs
          path: build-inputs

      - name: Publish pre-release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN: ${{ github.run_number }}
          SHA: ${{ github.sha }}
          BRANCH: ${{ github.ref_name }}
        run: |
          gh release create "build-inputs-$RUN" \
            build-inputs/wrapper/gradle-wrapper.properties \
            build-inputs/verification-metadata.xml \
            --target "$SHA" \
            --title "Pinned build inputs $RUN ($BRANCH)" \
            --notes "Gradle distribution checksum and dependency verification metadata, to review and commit." \
            --prerelease --latest=false
