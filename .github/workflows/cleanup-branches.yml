name: Clean up merged branches

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    types: [closed]
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: read

concurrency:
  group: merged-branch-cleanup
  cancel-in-progress: false

jobs:
  cleanup:
    if: github.event_name != 'pull_request' || github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    steps:
      # No checkout or third-party action: use the runner's Python, gh and Git.
      - name: Delete finished branches without deleting newer work
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import subprocess
          import tempfile
          
          def api(path, method="GET", paginate=False):
              command = ["gh", "api", "--method", method, path]
              if paginate:
                  command += ["--paginate", "--slurp"]
              result = subprocess.run(command, check=True, capture_output=True, text=True)
              if not result.stdout.strip():
                  return None
              data = json.loads(result.stdout)
              return [item for page in data for item in page] if paginate else data
          
          repo = os.environ["GH_REPO"]
          prefix = f"repos/{repo}"
          default = api(prefix)["default_branch"]
          pulls = api(f"{prefix}/pulls?state=all&per_page=100", paginate=True)
          active = {p["head"]["ref"] for p in pulls if p["state"] == "open"
                    and p["head"]["repo"] and p["head"]["repo"]["full_name"] == repo}
          merged = {(p["head"]["ref"], p["head"]["sha"]) for p in pulls if p["merged_at"]
                    and p["head"]["repo"] and p["head"]["repo"]["full_name"] == repo}
          # Retired experiments: old CI triggers and shortcut diagnostics. The production
          # shortcut retry and its regressions were merged separately in PR #17.
          retired = {
              ("feature/settings-home-test-build", "65601a11764d28b83b86d1f767baaa1d055c49e4"),
              ("feature/shortcut-tap-probe", "018a7cbfeca15ebbc7554ec0e03ad8521a57dcba"),
          }
          # gh reads GH_TOKEN; no credential appears in the URL, argv or repository.
          with tempfile.TemporaryDirectory() as directory:
              subprocess.run(["git", "init", "--bare", "--quiet", directory], check=True)
              git = ["git", "-C", directory, "-c", "credential.helper=",
                     "-c", "credential.helper=!gh auth git-credential"]
              git_env = dict(os.environ, GIT_TERMINAL_PROMPT="0", LC_ALL="C")
              for branch in api(f"{prefix}/branches?per_page=100", paginate=True):
                  name, sha = branch["name"], branch["commit"]["sha"]
                  if name == default or branch["protected"] or name in active:
                      continue
                  if (name, sha) not in merged | retired:
                      print(f"Keep {name}: no merged PR at its current tip")
                      continue
                  ref = f"refs/heads/{name}"
                  result = subprocess.run(git + ["push", "--porcelain",
                      f"--force-with-lease={ref}:{sha}", f"https://github.com/{repo}.git",
                      f":{ref}"], env=git_env, capture_output=True, text=True)
                  if result.returncode:
                      if f"!\t(delete):{ref}\t[rejected] (stale info)" in result.stdout.splitlines():
                          print(f"Keep {name}: branch moved or disappeared during cleanup")
                          continue
                      raise RuntimeError(f"Could not delete {name}:\n{result.stdout}{result.stderr}")
                  print(f"Delete {name} at {sha}")
          PY
