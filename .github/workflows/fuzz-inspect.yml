name: Inspect corruption evidence
on:
  push:
    branches: [feature/fuzz-100]
    paths: [eval/fuzz/inspect.json]
permissions:
  contents: read
  actions: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      matrix:
        part: [0, 1, 2, 3]
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: fuzz-100-evidence
          run-id: 38404204649
          github-token: ${{ github.token }}
          path: evidence
      - name: Read saved evidence
        env:
          PART: ${{ matrix.part }}
        run: |
          python3 - <<'PY'
          import json, pathlib, collections, os
          root = pathlib.Path("evidence")
          rows = [json.loads(l) for l in next(root.rglob("replies.jsonl")).read_text().split("\n") if l]
          engine = {r["request_id"]: r for r in (json.loads(l) for l in next(root.rglob("engine.jsonl")).read_text().split("\n") if l)}
          print("REVIEW_BEGIN")
          for i, row in enumerate(sorted(rows, key=lambda r: r["case"]["request_id"])):
              if i % 4 == int(os.environ["PART"]):
                  print(json.dumps({**row, "engine": engine[row["case"]["request_id"]]}, ensure_ascii=False))
          print("REVIEW_END")
          print("ERROR_COUNTS", collections.Counter((r.get("error"), r.get("http_status")) for r in rows if "error" in r))
          print("SUMMARY", json.dumps({"requests": len(rows), "answered": sum("verdict" in r for r in rows), "errors": sum("error" in r for r in rows)}))
          PY
