name: Inspect available evaluation models
on:
  push:
    branches: [feature/fuzz-100]
    paths: [eval/fuzz/probe.json]
permissions:
  contents: read
jobs:
  catalog:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Read available text model IDs
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          python3 - <<'PY'
          import json, os, urllib.request, urllib.parse
          token, seen, ids = None, set(), []
          for page in range(10):
              query = {"pageSize": 1000}
              if token: query["pageToken"] = token
              req = urllib.request.Request("https://generativelanguage.googleapis.com/v1beta/models?" + urllib.parse.urlencode(query),
                                           headers={"x-goog-api-key": os.environ["GEMINI_API_KEY"]})
              with urllib.request.urlopen(req, timeout=30) as reply:
                  data = json.load(reply)
              ids += [model["name"].removeprefix("models/") for model in data.get("models", [])
                      if "generateContent" in model.get("supportedGenerationMethods", []) and model["name"].startswith("models/gemini")]
              token = data.get("nextPageToken")
              if not token or token in seen: break
              seen.add(token)
          print("MODEL_CATALOG_BEGIN")
          print(json.dumps(sorted(set(ids))))
          print("MODEL_CATALOG_END")
          PY
