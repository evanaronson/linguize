name: Live corruption evaluation

on:
  push:
    branches: [feature/fuzz-100]
    paths: [eval/fuzz/request.json]
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6
      - name: Reuse previous answers
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: fuzz-100-evidence
          run-id: 38399239455
          github-token: ${{ github.token }}
          path: previous
      - name: Preserve successful checks
        run: |
          python3 - <<'PY'
          import pathlib, shutil
          source = next(pathlib.Path("previous").rglob("replies.jsonl"))
          target = pathlib.Path("eval/fuzz/results/replies.jsonl")
          target.parent.mkdir(parents=True, exist_ok=True)
          shutil.copyfile(source, target)
          PY
      - name: Generate and verify corpus
        run: |
          python3 -m unittest discover -s eval -p 'test_*.py'
          python3 eval/fuzz.py
      - name: Check every passage in named and automatic language modes
        id: provider
        continue-on-error: true
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python3 eval/fuzz.py --live --workers 2 --interval 5 --retry-errors
      - name: Replay every answer through the production checker and Accept engine
        if: always()
        env:
          LINGUIZE_FUZZ_REPLIES: ${{ github.workspace }}/eval/fuzz/results/replies.jsonl
          LINGUIZE_FUZZ_ENGINE: ${{ github.workspace }}/eval/fuzz/results/engine.jsonl
        run: ./gradlew testDebugUnitTest --rerun-tasks --tests com.evanaronson.linguize.FuzzReplayTest
      - name: Upload all evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: fuzz-100-evidence
          path: |
            eval/fuzz/generated.jsonl
            eval/fuzz/results/
            app/build/test-results/
          if-no-files-found: error
          retention-days: 30
      - name: Fail incomplete provider runs
        if: steps.provider.outcome == 'failure'
        run: exit 1
