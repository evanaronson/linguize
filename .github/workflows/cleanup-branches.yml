name: Clean up merged branches

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    types: [closed]
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: read

concurrency:
  group: merged-branch-cleanup
  cancel-in-progress: false

jobs:
  cleanup:
    if: github.event_name != 'pull_request' || github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    steps:
      # No checkout or third-party action: only GitHub's API and the runner's Python/gh.
      - name: Delete finished branches without deleting newer work
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import subprocess
          from urllib.parse import quote
          
          def api(path, method="GET", paginate=False):
              command = ["gh", "api", "--method", method, path]
              if paginate:
                  command += ["--paginate", "--slurp"]
              result = subprocess.run(command, check=True, capture_output=True, text=True)
              if not result.stdout.strip():
                  return None
              data = json.loads(result.stdout)
              return [item for page in data for item in page] if paginate else data
          
          repo = os.environ["GH_REPO"]
          prefix = f"repos/{repo}"
          default = api(prefix)["default_branch"]
          pulls = api(f"{prefix}/pulls?state=all&per_page=100", paginate=True)
          active = {p["head"]["ref"] for p in pulls if p["state"] == "open"
                    and p["head"]["repo"] and p["head"]["repo"]["full_name"] == repo}
          merged = {(p["head"]["ref"], p["head"]["sha"]) for p in pulls if p["merged_at"]
                    and p["head"]["repo"] and p["head"]["repo"]["full_name"] == repo}
          # Retired signed-build experiment: its only unmerged changes are old CI triggers.
          retired = {("feature/settings-home-test-build", "65601a11764d28b83b86d1f767baaa1d055c49e4")}
          for branch in api(f"{prefix}/branches?per_page=100", paginate=True):
              name, sha = branch["name"], branch["commit"]["sha"]
              if name == default or branch["protected"] or name in active:
                  continue
              if (name, sha) not in merged | retired:
                  print(f"Keep {name}: no merged PR at its current tip")
                  continue
              ref = f"{prefix}/git/ref/heads/{quote(name, safe='')}"
              current = api(ref)
              if current["object"]["sha"] != sha:
                  print(f"Keep {name}: branch moved during cleanup")
                  continue
              print(f"Delete {name} at {sha}")
              api(f"{prefix}/git/refs/heads/{quote(name, safe='')}", method="DELETE")
          PY
